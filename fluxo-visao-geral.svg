<text x="590.0" y="56" text-anchor="middle" class="maintitle">Fluxo de trabalho — visão geral</text>
<text x="590.0" y="84" text-anchor="middle" class="subtitle">Método Agêntico — ordem dos processos e onde a pessoa precisa interagir</text>

<rect x="190" y="394" width="900" height="708" rx="18" fill="#1c2129" fill-opacity="0.35" stroke="#2a2f3a" stroke-width="1" stroke-dasharray="6,5"/>
<text x="220" y="420" class="sectionlabel">FUNDAÇÃO — SÓ NA PRIMEIRA VEZ</text>
<rect x="190" y="1140" width="900" height="722" rx="18" fill="#1c2129" fill-opacity="0.35" stroke="#2a2f3a" stroke-width="1" stroke-dasharray="6,5"/>
<text x="220" y="1166" class="sectionlabel">CICLO RECORRENTE — A CADA NOVA DEMANDA</text>
<text x="260" y="156" class="sectionlabel">ENTRADA</text><rect x="260" y="170" width="760" height="72" rx="36.0" fill="#1c2129" stroke="#7d8794" stroke-width="2.5"/><circle cx="226" cy="206.0" r="17" fill="#1c2129" stroke="#7d8794" stroke-width="2"/><text x="226" y="211.0" text-anchor="middle" class="badge" fill="#7d8794">1</text><text x="294" y="199" text-anchor="start" class="title">Entrada</text><text x="294" y="220" text-anchor="start" class="note">a ferramenta reconhece o método sozinha</text><rect x="888" y="184" width="118" height="20" rx="10" fill="#7d879422" stroke="#7d8794" stroke-width="1"/><text x="947.0" y="198" text-anchor="middle" class="taglabel" fill="#7d8794">AUTOMÁTICO</text><polygon points="640.0,272 1020,321.0 640.0,370 260,321.0" fill="#1c2129" stroke="#7d8794" stroke-width="2.5"/><circle cx="226" cy="321.0" r="17" fill="#1c2129" stroke="#7d8794" stroke-width="2"/><text x="226" y="326.0" text-anchor="middle" class="badge" fill="#7d8794">2</text><text x="640.0" y="315.0" text-anchor="middle" class="title">Verificação de estado</text><text x="640.0" y="335.0" text-anchor="middle" class="note">projeto novo ou já com base estabelecida?</text><line x1="640.0" y1="242" x2="640.0" y2="272" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="400" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="400" width="6" height="72" rx="3" fill="#4fb0ff"/><circle cx="226" cy="436.0" r="17" fill="#1c2129" stroke="#4fb0ff" stroke-width="2"/><text x="226" y="441.0" text-anchor="middle" class="badge" fill="#4fb0ff">3</text><text x="294" y="429" text-anchor="start" class="title">Entendimento do produto</text><text x="294" y="450" text-anchor="start" class="note">a IA pergunta — problema, público, escopo</text><rect x="888" y="414" width="118" height="20" rx="10" fill="#4fb0ff22" stroke="#4fb0ff" stroke-width="1"/><text x="947.0" y="428" text-anchor="middle" class="taglabel" fill="#4fb0ff">PESSOA RESPONDE</text><line x1="640.0" y1="370" x2="640.0" y2="400" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="502" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="502" width="6" height="72" rx="3" fill="#f5b942"/><circle cx="226" cy="538.0" r="17" fill="#1c2129" stroke="#f5b942" stroke-width="2"/><text x="226" y="543.0" text-anchor="middle" class="badge" fill="#f5b942">4</text><text x="294" y="531" text-anchor="start" class="title">Confirmação do entendimento de produto</text><text x="294" y="552" text-anchor="start" class="note">a pessoa aprova ou corrige o rascunho</text><rect x="888" y="516" width="118" height="20" rx="10" fill="#f5b94222" stroke="#f5b942" stroke-width="1"/><text x="947.0" y="530" text-anchor="middle" class="taglabel" fill="#f5b942">PESSOA APROVA</text><line x1="640.0" y1="472" x2="640.0" y2="502" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="604" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="604" width="6" height="72" rx="3" fill="#4fb0ff"/><circle cx="226" cy="640.0" r="17" fill="#1c2129" stroke="#4fb0ff" stroke-width="2"/><text x="226" y="645.0" text-anchor="middle" class="badge" fill="#4fb0ff">5</text><text x="294" y="633" text-anchor="start" class="title">Entendimento técnico</text><text x="294" y="654" text-anchor="start" class="note">a IA pergunta — tecnologia, dependências, limitações</text><rect x="888" y="618" width="118" height="20" rx="10" fill="#4fb0ff22" stroke="#4fb0ff" stroke-width="1"/><text x="947.0" y="632" text-anchor="middle" class="taglabel" fill="#4fb0ff">PESSOA RESPONDE</text><line x1="640.0" y1="574" x2="640.0" y2="604" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="706" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="706" width="6" height="72" rx="3" fill="#f5b942"/><circle cx="226" cy="742.0" r="17" fill="#1c2129" stroke="#f5b942" stroke-width="2"/><text x="226" y="747.0" text-anchor="middle" class="badge" fill="#f5b942">6</text><text x="294" y="735" text-anchor="start" class="title">Confirmação do entendimento técnico</text><text x="294" y="756" text-anchor="start" class="note">a pessoa aprova ou corrige o rascunho</text><rect x="888" y="720" width="118" height="20" rx="10" fill="#f5b94222" stroke="#f5b942" stroke-width="1"/><text x="947.0" y="734" text-anchor="middle" class="taglabel" fill="#f5b942">PESSOA APROVA</text><line x1="640.0" y1="676" x2="640.0" y2="706" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="808" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="808" width="6" height="72" rx="3" fill="#4fb0ff"/><circle cx="226" cy="844.0" r="17" fill="#1c2129" stroke="#4fb0ff" stroke-width="2"/><text x="226" y="849.0" text-anchor="middle" class="badge" fill="#4fb0ff">7</text><text x="294" y="837" text-anchor="start" class="title">Definição de critério de qualidade</text><text x="294" y="858" text-anchor="start" class="note">perguntas objetivas sobre como validar</text><rect x="888" y="822" width="118" height="20" rx="10" fill="#4fb0ff22" stroke="#4fb0ff" stroke-width="1"/><text x="947.0" y="836" text-anchor="middle" class="taglabel" fill="#4fb0ff">PESSOA RESPONDE</text><line x1="640.0" y1="778" x2="640.0" y2="808" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="910" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="910" width="6" height="72" rx="3" fill="#4fb0ff"/><circle cx="226" cy="946.0" r="17" fill="#1c2129" stroke="#4fb0ff" stroke-width="2"/><text x="226" y="951.0" text-anchor="middle" class="badge" fill="#4fb0ff">8</text><text x="294" y="939" text-anchor="start" class="title">Definição de referências complementares</text><text x="294" y="960" text-anchor="start" class="note">visual e vocabulário — só se aplicável</text><rect x="888" y="924" width="118" height="20" rx="10" fill="#4fb0ff22" stroke="#4fb0ff" stroke-width="1"/><text x="947.0" y="938" text-anchor="middle" class="taglabel" fill="#4fb0ff">PESSOA RESPONDE</text><line x1="640.0" y1="880" x2="640.0" y2="910" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="1012" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="1012" width="6" height="72" rx="3" fill="#f5b942"/><circle cx="226" cy="1048.0" r="17" fill="#1c2129" stroke="#f5b942" stroke-width="2"/><text x="226" y="1053.0" text-anchor="middle" class="badge" fill="#f5b942">9</text><text x="294" y="1041" text-anchor="start" class="title">Registro do estado inicial</text><text x="294" y="1062" text-anchor="start" class="note">a pessoa aprova o primeiro passo técnico</text><rect x="888" y="1026" width="118" height="20" rx="10" fill="#f5b94222" stroke="#f5b942" stroke-width="1"/><text x="947.0" y="1040" text-anchor="middle" class="taglabel" fill="#f5b942">PESSOA APROVA</text><line x1="640.0" y1="982" x2="640.0" y2="1012" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="1160" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="1160" width="6" height="72" rx="3" fill="#7d8794"/><circle cx="226" cy="1196.0" r="17" fill="#1c2129" stroke="#7d8794" stroke-width="2"/><text x="226" y="1201.0" text-anchor="middle" class="badge" fill="#7d8794">10</text><text x="294" y="1189" text-anchor="start" class="title">Retomada do contexto</text><text x="294" y="1210" text-anchor="start" class="note">a IA relê o que já existe antes de agir</text><rect x="888" y="1174" width="118" height="20" rx="10" fill="#7d879422" stroke="#7d8794" stroke-width="1"/><text x="947.0" y="1188" text-anchor="middle" class="taglabel" fill="#7d8794">AUTOMÁTICO</text><line x1="640.0" y1="1084" x2="640.0" y2="1160" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="1262" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="1262" width="6" height="72" rx="3" fill="#4fb0ff"/><circle cx="226" cy="1298.0" r="17" fill="#1c2129" stroke="#4fb0ff" stroke-width="2"/><text x="226" y="1303.0" text-anchor="middle" class="badge" fill="#4fb0ff">11</text><text x="294" y="1291" text-anchor="start" class="title">Pedido da demanda</text><text x="294" y="1312" text-anchor="start" class="note">a pessoa pede uma funcionalidade, correção ou mudança</text><rect x="888" y="1276" width="118" height="20" rx="10" fill="#4fb0ff22" stroke="#4fb0ff" stroke-width="1"/><text x="947.0" y="1290" text-anchor="middle" class="taglabel" fill="#4fb0ff">PESSOA RESPONDE</text><line x1="640.0" y1="1232" x2="640.0" y2="1262" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="1364" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="1364" width="6" height="72" rx="3" fill="#7d8794"/><circle cx="226" cy="1400.0" r="17" fill="#1c2129" stroke="#7d8794" stroke-width="2"/><text x="226" y="1405.0" text-anchor="middle" class="badge" fill="#7d8794">12</text><text x="294" y="1393" text-anchor="start" class="title">Entendimento e classificação do pedido</text><text x="294" y="1414" text-anchor="start" class="note">só pergunta de volta se não conseguir inferir</text><rect x="888" y="1378" width="118" height="20" rx="10" fill="#7d879422" stroke="#7d8794" stroke-width="1"/><text x="947.0" y="1392" text-anchor="middle" class="taglabel" fill="#7d8794">AUTOMÁTICO</text><line x1="640.0" y1="1334" x2="640.0" y2="1364" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="1466" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="1466" width="6" height="72" rx="3" fill="#f5b942"/><circle cx="226" cy="1502.0" r="17" fill="#1c2129" stroke="#f5b942" stroke-width="2"/><text x="226" y="1507.0" text-anchor="middle" class="badge" fill="#f5b942">13</text><text x="294" y="1495" text-anchor="start" class="title">Proposta de escopo</text><text x="294" y="1516" text-anchor="start" class="note">a pessoa revisa o que vai e o que não vai ser feito</text><rect x="888" y="1480" width="118" height="20" rx="10" fill="#f5b94222" stroke="#f5b942" stroke-width="1"/><text x="947.0" y="1494" text-anchor="middle" class="taglabel" fill="#f5b942">PESSOA APROVA</text><line x1="640.0" y1="1436" x2="640.0" y2="1466" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="1568" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="1568" width="6" height="72" rx="3" fill="#7d8794"/><circle cx="226" cy="1604.0" r="17" fill="#1c2129" stroke="#7d8794" stroke-width="2"/><text x="226" y="1609.0" text-anchor="middle" class="badge" fill="#7d8794">14</text><text x="294" y="1597" text-anchor="start" class="title">Implementação</text><text x="294" y="1618" text-anchor="start" class="note">a IA constrói dentro do escopo aprovado</text><rect x="888" y="1582" width="118" height="20" rx="10" fill="#7d879422" stroke="#7d8794" stroke-width="1"/><text x="947.0" y="1596" text-anchor="middle" class="taglabel" fill="#7d8794">AUTOMÁTICO</text><line x1="640.0" y1="1538" x2="640.0" y2="1568" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="1670" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="1670" width="6" height="72" rx="3" fill="#7d8794"/><circle cx="226" cy="1706.0" r="17" fill="#1c2129" stroke="#7d8794" stroke-width="2"/><text x="226" y="1711.0" text-anchor="middle" class="badge" fill="#7d8794">15</text><text x="294" y="1699" text-anchor="start" class="title">Verificação</text><text x="294" y="1720" text-anchor="start" class="note">testes e critérios de qualidade executados</text><rect x="888" y="1684" width="118" height="20" rx="10" fill="#7d879422" stroke="#7d8794" stroke-width="1"/><text x="947.0" y="1698" text-anchor="middle" class="taglabel" fill="#7d8794">AUTOMÁTICO</text><line x1="640.0" y1="1640" x2="640.0" y2="1670" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="1772" width="760" height="72" rx="12" fill="#171a21" stroke="#2a2f3a" stroke-width="1.5"/><rect x="260" y="1772" width="6" height="72" rx="3" fill="#f5b942"/><circle cx="226" cy="1808.0" r="17" fill="#1c2129" stroke="#f5b942" stroke-width="2"/><text x="226" y="1813.0" text-anchor="middle" class="badge" fill="#f5b942">16</text><text x="294" y="1801" text-anchor="start" class="title">Prestação de contas</text><text x="294" y="1822" text-anchor="start" class="note">a pessoa vê o que mudou e o próximo passo sugerido</text><rect x="888" y="1786" width="118" height="20" rx="10" fill="#f5b94222" stroke="#f5b942" stroke-width="1"/><text x="947.0" y="1800" text-anchor="middle" class="taglabel" fill="#f5b942">PESSOA APROVA</text><line x1="640.0" y1="1742" x2="640.0" y2="1772" stroke="#9aa1ac" stroke-width="2" marker-end="url(#arrow)"/>
